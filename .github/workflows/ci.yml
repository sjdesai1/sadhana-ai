name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sadhana
          POSTGRES_PASSWORD: sadhana
          POSTGRES_DB: sadhana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sadhana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests with coverage
        env:
          SADHANA_REQUIRE_DB: "1"  # database tests must run here, never skip
        run: uv run pytest -q --cov --cov-report=term-missing:skip-covered

      - name: Economics build for every demo office
        run: uv run python -m sadhana.economics

      - name: Validate docker-compose file
        run: cp .env.example .env && docker compose config --quiet

      # report-only for now: tightened over time
      - name: Type check (report only)
        continue-on-error: true
        run: uv run pyright

      - name: Dependency audit (report only)
        continue-on-error: true
        run: |
          uv export --frozen --no-hashes --no-emit-project > requirements-locked.txt
          uvx pip-audit -r requirements-locked.txt --no-deps --disable-pip

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

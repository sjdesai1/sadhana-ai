[project]
name = "sadhana"
version = "0.1.0"
description = "Schedule and revenue recovery for dental practices"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.17.0", "pre-commit>=4.0", "pyright>=1.1.400", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }   # one source of truth for deps

[tool.setuptools.packages.find]
where = ["src"]

[tool.dagster]
module_name = "sadhana.pipelines.definitions"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["src/sadhana"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
# dependencies live in requirements.txt; tell uv to re-read them when that file changes
cache-keys = [{ file = "pyproject.toml" }, { file = "requirements.txt" }]

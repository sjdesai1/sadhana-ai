services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sadhana
      POSTGRES_PASSWORD: sadhana
      POSTGRES_DB: sadhana
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadhana"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SADHANA_DATABASE_URL: postgresql+psycopg://sadhana:sadhana@postgres:5432/sadhana
      SADHANA_SMTP_HOST: mailpit
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy

  dagster:
    build: .
    command: ["dagster", "dev", "-h", "0.0.0.0", "-p", "3000", "-m", "sadhana.pipelines.definitions"]
    env_file:
      - path: .env
        required: false
    environment:
      SADHANA_DATABASE_URL: postgresql+psycopg://sadhana:sadhana@postgres:5432/sadhana
      DAGSTER_HOME: /app/.dagster
    ports:
      - "3000:3000"
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  # Open Dental test database: MySQL loaded with the Open Dental demo data.
  # Enabled at the sync step with: docker compose --profile opendental up
  opendental-db:
    image: mysql:8.0
    profiles: ["opendental"]
    environment:
      MYSQL_ROOT_PASSWORD: opendental
      MYSQL_DATABASE: opendental
    ports:
      - "3306:3306"
    volumes:
      - oddata:/var/lib/mysql

volumes:
  pgdata:
  oddata:
